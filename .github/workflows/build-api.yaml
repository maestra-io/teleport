name: Build API Module
run-name: Build API Module

on:
  pull_request:
    paths:
      - .github/workflows/build-api.yaml
      - 'api/**/*.go'
      - 'api/go.mod'
      - 'api/go.sum'
      - 'go.mod'
      - 'go.sum'
  merge_group:
    paths:
      - .github/workflows/build-api.yaml
      - 'api/**/*.go'
      - 'api/go.mod'
      - 'api/go.sum'
      - 'go.mod'
      - 'go.sum'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build API
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Teleport
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # use the version declared in API's go.mod
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Build
        run: cd api; go build ./...
