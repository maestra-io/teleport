# Secret scan of the pull request's commits with gitleaks: the org-wide reusable
# workflow of maestra-io/github-actions (official gitleaks/gitleaks-action, central
# config). Check name: `gitleaks / gitleaks`. maestra-io/issues-maestra#1568
name: gitleaks

on: pull_request

permissions:
  contents: read
  pull-requests: write # the PR's commit list, and a review comment per finding

jobs:
  gitleaks:
    uses: maestra-io/github-actions/.github/workflows/gitleaks.yml@6fb4ef6b0ae18cf57352e956b2a10e2b6daef06c # main
    secrets: inherit
