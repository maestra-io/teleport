name: Build on Windows
run-name: Build on Windows

on:
  merge_group:
    paths:
      - ".github/workflows/build-windows.yaml"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "build.assets/Makefile"
      - "build.assets/Dockerfile*"
      - "Makefile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "lib/srv/desktop/rdp/decoder/Cargo.toml"
      - "lib/srv/desktop/rdp/decoder/src/**.rs"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build on Windows
    if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
    runs-on: windows-2022-16core

    permissions:
      contents: read

    steps:
      - name: Checkout Teleport
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Build
        shell: bash
        run: |
          export OS="windows"
          make build/tsh build/tctl build/tbot
