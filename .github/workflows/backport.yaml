# This workflow will create backport Pull Requests whenever a pull request with
# the appropriate labels is merged.
name: Backport
on:
  pull_request:
    types:
      - closed

# Limit the permissions on the GitHub token for this workflow to the subset
# that is required. In this case, the backport workflow needs to be able to
# create branches and create/update PRs, so it needs write access to
# "pull-requests" and "contents" permissions.
permissions:
  pull-requests: write
  contents: write
  id-token: write

jobs:
  backport-pull-request:
    name: Backport Pull Request
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Get runtime values from kvstore
        id: kvstore
        uses: gravitational/shared-workflows/tools/env-kvstore@d305931fcde5bc40a31806439bc1667d7a7d4f00 # tools/env-kvstore/v1.0.2
        with:
          cognito-identity-pool-id: "us-west-2:da53389e-a459-4a28-bd54-43eeb8e4b579"
          cognito-role-arn: "arn:aws:iam::247230412011:role/github-actions-cognito-oidc"
          values: |
            BACKPORT_APP_ID,variable
            BACKPORT_PRIVATE_KEY,secret
            REVIEWERS,secret
      - name: Generate GitHub Token
        id: generate_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ env.BACKPORT_APP_ID }}
          private-key: ${{ env.BACKPORT_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          token: ${{ steps.generate_token.outputs.token }}
      # Checkout main branch of shared-workflow repository.
      - name: Checkout shared-workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: gravitational/shared-workflows
          path: .github/shared-workflows
          ref: 986f92841a4f032e262477e5bb15f214d50b1015 # workflows/v0.0.6
      - name: Installing Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 'stable'
        # Run "backport" subcommand on bot.
      - name: Backport PR
        run: ( cd .github/shared-workflows/bot && go build ) && .github/shared-workflows/bot/bot -workflow=backport -token="${{ steps.generate_token.outputs.token }}" -reviewers="${{ env.REVIEWERS }}"
